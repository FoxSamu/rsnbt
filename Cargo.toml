[package]
name = "rsnbt"
version = "0.1.0"
edition = "2024"

[dependencies]

[dependencies.lz4]
version = "1.28.1"

[dependencies.flate2]
version = "1.1.10"

[dependencies.unicode_names]
package = "unicode_names2"
version = "4.0.0"
optional = true

[dependencies.xxh]
package = "xxhash-rust"
version = "0.8.19"
features = ["xxh32"]
optional = true

[features]
snbt = ["dep:unicode_names"]
lz4b = ["dep:xxh"]
mca  = ["lz4b"]
